<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F2EFF7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Coach" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <title>Coach</title>
  <style>
    /* v12 : charte claire, angles droits, Unbounded (titres, chiffres) + Inter (texte) */
    :root {
      --bg: #F2EFF7; --card: #FFFFFF; --ink: #14121C; --muted: #5E586F; --line: #E3DEEC; --line2: #EFEBF5; --soft: #E6E1EE;
      --pink: #FF2D87; --pink-text: #D6006A; --violet: #9B4DFF; --violet-dark: #7B2CFF; --blue: #2E6BFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg); }
    body { background: var(--bg); color: var(--ink); font-family: Inter, -apple-system, system-ui, sans-serif; font-size: 15px; min-height: 100vh; max-width: 430px; margin: 0 auto; padding-top: env(safe-area-inset-top); padding-bottom: calc(92px + env(safe-area-inset-bottom)); -webkit-font-smoothing: antialiased; }
    body.no-tabs { padding-bottom: 40px; }
    button { border: none; cursor: pointer; font-family: inherit; color: inherit; background: none; }
    input, textarea { font-family: inherit; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fade { animation: fadeUp 0.3s ease both; }

    .screen { padding: 22px 20px 24px; }
    .d { font-family: Unbounded, Inter, sans-serif; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
    .h1 { font-family: Unbounded, Inter, sans-serif; font-size: 26px; font-weight: 800; line-height: 1.1; letter-spacing: -0.3px; }
    .sec { margin: 24px 0 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .muted { color: var(--muted); }
    .card { background: var(--card); padding: 16px 18px; }
    .card + .card { margin-top: 8px; }
    .tap { cursor: pointer; }

    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; padding: 0 12px; background: var(--card); border: 1px solid var(--line); color: var(--ink); font-size: 14px; font-weight: 600; text-align: center; line-height: 1.2; }
    .btn-primary { background: var(--pink); border: 0; color: var(--ink); font-family: Unbounded, Inter, sans-serif; font-size: 15px; font-weight: 700; min-height: 52px; }
    .btn-dark { background: var(--ink); border: 0; color: #FFFFFF; font-weight: 700; }
    .btn-ghost { background: transparent; }
    .btn-danger { background: transparent; color: var(--pink-text); border: 1px solid var(--line); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

    .hero { background: linear-gradient(140deg, #7B2CFF 0%, #3A4BFF 100%); color: #FFFFFF; padding: 22px; }
    .hero .eyebrow { color: #FFFFFF; }
    .pill { display: inline-block; background: rgba(11,10,18,0.28); color: #FFFFFF; padding: 8px 12px; font-size: 13px; font-weight: 600; }
    .chip { display: inline-block; padding: 6px 10px; font-size: 12px; font-weight: 800; white-space: nowrap; }
    .tag { display: inline-block; padding: 3px 8px; font-size: 12px; font-weight: 700; background: var(--bg); color: var(--ink); margin: 6px 6px 0 0; }

    .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line2); }
    .row:last-child { border-bottom: 0; }
    .row .k { font-size: 14px; color: var(--muted); }
    .row .v { font-size: 14px; font-weight: 700; text-align: right; }
    .link { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%; background: var(--card); padding: 15px 18px; font-size: 14px; font-weight: 600; text-align: left; min-height: 52px; }
    .link + .link { margin-top: 6px; }
    .link .s { color: var(--muted); font-weight: 500; }

    .stat { background: var(--card); padding: 14px 16px; }
    .stat .n { font-family: Unbounded, Inter, sans-serif; font-size: 20px; font-weight: 700; line-height: 1.15; word-break: break-word; }
    .stat .l { font-size: 12px; color: var(--muted); margin-top: 5px; }

    .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--card); padding: 4px; margin-bottom: 22px; }
    .seg button { min-height: 40px; font-size: 14px; font-weight: 600; color: var(--muted); }
    .seg button.on { background: var(--ink); color: #FFFFFF; font-weight: 700; }

    .backbar { display: flex; align-items: center; gap: 6px; margin: -6px 0 16px -6px; }
    .backbar button { display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700; color: var(--ink); min-height: 44px; padding: 0 6px; }

    .tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; background: #FFFFFF; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); z-index: 50; }
    .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; font-size: 11px; font-weight: 600; color: var(--muted); }
    .tab.on { color: var(--pink-text); font-weight: 700; }

    .bullet { display: flex; gap: 12px; align-items: flex-start; }
    .bullet + .bullet { margin-top: 12px; }
    .bullet .ic { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .bullet .t { font-size: 15px; line-height: 1.45; padding-top: 2px; }
    .sq { width: 8px; height: 8px; flex-shrink: 0; margin-top: 7px; }

    .dialog-overlay { position: fixed; inset: 0; background: rgba(20,18,28,0.55); display: flex; align-items: flex-end; justify-content: center; z-index: 100; padding: 0 0 env(safe-area-inset-bottom); animation: fadeUp 0.2s ease both; }
    .dialog-box, .confirm-box { background: #FFFFFF; padding: 24px 20px 32px; width: 100%; max-width: 430px; }
    .dialog-title, .confirm-title { font-family: Unbounded, Inter, sans-serif; font-size: 17px; font-weight: 700; margin-bottom: 8px; }
    .dialog-sub, .confirm-sub { font-size: 14px; color: var(--muted); margin-bottom: 16px; line-height: 1.5; }
    .dialog-textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--ink); font-size: 15px; padding: 14px; resize: none; outline: none; line-height: 1.5; min-height: 110px; }
    .dialog-textarea:focus, .obj-input:focus { border-color: var(--violet-dark); }
    .dialog-actions, .confirm-actions { display: flex; gap: 8px; margin-top: 12px; }
    .dialog-actions .btn, .confirm-actions .btn { flex: 1; }

    .obj-input { width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--ink); font-size: 16px; padding: 12px; outline: none; min-height: 48px; }
    .obj-input::placeholder { color: #8A849B; }
    .obj-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px; font-weight: 700; }
    .pick { min-height: 48px; border: 2px solid var(--line); background: var(--card); font-size: 15px; font-weight: 700; color: var(--muted); }
    .pick.on { border-color: var(--ink); background: var(--ink); color: #FFFFFF; }
  </style>
</head>
<body>
<div id="app"></div>
<div id="overlay-root"></div>
<script>
/* ============================================================
   MIGRATION (v3) : l'app n'est plus liée au Marathon de Nice.
   On purge les caches et l'ancien objectif chrono marathon.
   v6 : séances détaillées (déroulé, objectif, critère) + logique de semaine.
   v7 : fiche coureur (lecture seule) + détail des séances de la semaine au toucher.
   v8 : synchronisation serveur (clé de l'app, résultats et réglages gardés côté serveur).
   v9 : analyse de la dernière séance, détection automatique (webhook Strava), écran d'état.
   v10 : accueil réorganisé (1 bouton principal + grille 2x2), bouton semaine supprimé,
         programme de la semaine suivante le dimanche ou quand la semaine est terminée.
   v11 : service worker (fin des soucis de cache) + notifications push.
   v12 : nouvelle charte (claire, rose / violet / bleu électriques, angles droits, Unbounded + Inter),
         navigation par onglets (Séance, Semaine, Analyses, Profil), écrans épurés,
         fiche coureur réorganisée et synchronisée depuis le serveur.
   ============================================================ */
const APP_VERSION = 12;
(function migrate() {
  const v = parseInt(localStorage.getItem('mc_app_version') || '1', 10);
  if (v < 3) {
    ['mc_last_result','mc_weekly_plan','mc_confidence','mc_last_bilan',
     'mc_week_done_km','mc_volume_history','mc_goal','mc_objective']
      .forEach(function(k){ localStorage.removeItem(k); });
  }
  // v12 : la fiche coureur change de format, l'ancienne copie locale est jetée
  if (v < 12) localStorage.removeItem('mc_runner');
  if (v < APP_VERSION) localStorage.setItem('mc_app_version', String(APP_VERSION));
})();

/* ============================================================
   OBJECTIF : optionnel.
   null  → mode « Entraînement libre » (progression continue)
   objet → { name, date|null, distanceKm|null, dplus|null, targetTime|null }
   ============================================================ */
function loadObjective() {
  try {
    const o = JSON.parse(localStorage.getItem('mc_objective') || 'null');
    if (!o) return null;
    // Un objectif vide est traité comme absent
    if (!o.name && !o.date && !o.distanceKm && !o.dplus && !o.targetTime) return null;
    return o;
  } catch { return null; }
}
function saveObjective(o) { localStorage.setItem('mc_objective', JSON.stringify(o)); }
function clearObjective() { localStorage.removeItem('mc_objective'); }
function hasObjective() { return loadObjective() !== null; }

// Jours restants (null si pas de date)
function objectiveDays(o) {
  if (!o || !o.date) return null;
  const race = new Date(o.date + 'T08:00:00');
  if (isNaN(race.getTime())) return null;
  return Math.max(0, Math.ceil((race - new Date()) / 86400000));
}
function getPhase(d) {
  if (d > 63) return { label:"Fondamentaux" };
  if (d > 35) return { label:"Construction" };
  if (d > 14) return { label:"Spécifique" };
  return           { label:"Affûtage" };
}

function timeLabel(min) {
  if (!min || min <= 0) return null;
  return Math.floor(min/60) + 'h' + String(min%60).padStart(2,'0');
}
function fmtKm(v) { return String(v).replace('.', ','); }
function fmtDateFr(iso) {
  if (!iso) return null;
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d.getTime())) return null;
  return d.toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });
}
// L'objectif est-il "montagne" ? (présence de dénivelé)
function isTrailObjective(o) { return !!(o && o.dplus > 0); }


const DAYS_FR = ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
const FULL_DAYS_FR = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
// Ordre Lun→Dim utilisé par le champ "nextDay" et par week[] côté backend
const FR_DAY_ORDER = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];

// Âge d'un cache : heures puis jours
function formatAge(savedAt) {
  const h = Math.round((Date.now() - savedAt) / 3600000);
  if (h < 1) return "moins d'1h";
  if (h < 48) return h + 'h';
  return Math.round(h / 24) + ' jours';
}

// Lundi de la semaine en cours, format YYYY-MM-DD (même convention que le backend)
function getMondayStr() {
  const now = new Date();
  const day = now.getDay(); // 0=dim ... 6=sam
  const diff = day === 0 ? -6 : 1 - day;
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diff);
  const pad = n => String(n).padStart(2, '0');
  return monday.getFullYear() + '-' + pad(monday.getMonth() + 1) + '-' + pad(monday.getDate());
}
// Index du jour courant dans l'ordre Lun(0)...Dim(6)
function todayMondayBasedIndex() {
  const d = new Date().getDay(); // 0=dim...6=sam
  return d === 0 ? 6 : d - 1;
}

// Cache helpers
function saveCache(result, savedAt) {
  localStorage.setItem("mc_last_result", JSON.stringify({ result, savedAt: savedAt || Date.now() }));
}
function loadCache() {
  try { return JSON.parse(localStorage.getItem("mc_last_result") || "null"); } catch { return null; }
}
function saveWeeklyPlan(week) {
  if (week && week.length) localStorage.setItem("mc_weekly_plan", JSON.stringify(week));
}
function loadWeeklyPlan() {
  try { return JSON.parse(localStorage.getItem("mc_weekly_plan") || "null"); } catch { return null; }
}
// Fil conducteur de la semaine (1 phrase), sauvegardé avec le plan
function saveWeekLogic(txt) {
  if (txt && String(txt).trim()) localStorage.setItem("mc_week_logic", String(txt).trim());
}
function loadWeekLogic() {
  return localStorage.getItem("mc_week_logic");
}
// Fiche coureur renvoyée par le serveur (source : api/_lib/runner.js)
function saveRunner(r) {
  if (r) localStorage.setItem("mc_runner", JSON.stringify(r));
}
function loadRunner() {
  try { return JSON.parse(localStorage.getItem("mc_runner") || "null"); } catch { return null; }
}
// Analyse de la dernière séance { body, savedAt } et état du coach automatique
function saveLast(body) {
  if (body) localStorage.setItem("mc_last_session", JSON.stringify({ body: body, savedAt: body.savedAt || Date.now() }));
}
function loadLast() {
  try { return JSON.parse(localStorage.getItem("mc_last_session") || "null"); } catch { return null; }
}
function saveStatus(st) { if (st) localStorage.setItem("mc_status", JSON.stringify(st)); }
function loadStatus() {
  try { return JSON.parse(localStorage.getItem("mc_status") || "null"); } catch { return null; }
}
// Semaine (lundi) à laquelle correspond le cache mc_last_result / mc_weekly_plan actuel
function saveWeekStart(weekStart) {
  if (weekStart) localStorage.setItem("mc_week_start", weekStart);
}
function loadWeekStart() {
  return localStorage.getItem("mc_week_start");
}
function saveConfidence(val) {
  if (val !== undefined && val !== null) localStorage.setItem("mc_confidence", String(val));
}
function loadConfidence() {
  const v = localStorage.getItem("mc_confidence");
  return v !== null ? parseInt(v) : null;
}
function saveBilan(result, savedAt) {
  localStorage.setItem("mc_last_bilan", JSON.stringify({ result, savedAt: savedAt || Date.now() }));
}
function loadBilan() {
  try { return JSON.parse(localStorage.getItem("mc_last_bilan") || "null"); } catch { return null; }
}
function saveActivities(list) {
  if (list && list.length) localStorage.setItem("mc_last_activities", JSON.stringify(list));
}
function loadActivities() {
  try { return JSON.parse(localStorage.getItem("mc_last_activities") || "null"); } catch { return null; }
}
function saveVolume(v) {
  if (v && v.length) localStorage.setItem("mc_volume_history", JSON.stringify(v));
}
function loadVolume() {
  try { return JSON.parse(localStorage.getItem("mc_volume_history") || "null"); } catch { return null; }
}
function saveWeekDone(km) {
  if (km !== undefined && km !== null) localStorage.setItem("mc_week_done_km", String(km));
}
function loadWeekDone() {
  const v = localStorage.getItem("mc_week_done_km");
  return v !== null ? parseFloat(v) : null;
}

/* ---------------- Serveur : clé de l'app et synchronisation ---------------- */
function getAppKey() { return localStorage.getItem("mc_app_key"); }
function appHeaders(extra) {
  const hd = Object.assign({ "Content-Type": "application/json" }, extra || {});
  const k = getAppKey();
  if (k) hd["x-app-key"] = k;
  return hd;
}
// Statut affiché en bas de l'accueil : ok | off | err | null (pas de clé)
function syncStatus() { return getAppKey() ? (localStorage.getItem("mc_sync") || "?") : null; }

// Enregistre localement le résultat d'une analyse (bouton ou synchro serveur)
function applyAnalysisData(data) {
  if (!data || !data.result) return;
  const savedAt = data.savedAt || Date.now();
  if (data.activities) saveActivities(data.activities);
  if (data.volume) saveVolume(data.volume);
  if (data.runner) saveRunner(data.runner);
  if (data.weekStart && data.weekStart !== getMondayStr()) localStorage.removeItem('mc_week_done_km');
  else saveWeekDone(data.weekDoneKm);
  // L'indice de confiance n'a de sens que rapporté à un objectif
  if (hasObjective() && data.result.confidence !== undefined) saveConfidence(data.result.confidence);
  else localStorage.removeItem('mc_confidence');
  if (data.result._mode === 'bilan') {
    // Isolation d'état : le bilan ne touche JAMAIS state.result ni mc_last_result
    saveBilan(data.result, savedAt);
  } else {
    if (data.result.week) saveWeeklyPlan(data.result.week);
    saveWeekLogic(data.result.weekLogic);
    saveWeekStart(data.weekStart || getMondayStr());
    saveCache(data.result, savedAt);
  }
}

// Récupère les analyses plus récentes faites côté serveur
async function syncFromServer() {
  if (!getAppKey()) return;
  try {
    const r = await fetch("/api/state", { headers: appHeaders() });
    if (r.status === 401 || r.status === 503) { localStorage.setItem("mc_sync", "off"); if (isTabRoot(state.view)) render(); return; }
    if (!r.ok) throw new Error(String(r.status));
    const d = await r.json();
    let changed = false;
    const lc = loadCache();
    if (d.result && d.result.body && (!lc || (d.result.savedAt || 0) > (lc.savedAt || 0))) {
      applyAnalysisData(d.result.body);
      state.result = d.result.body.result;
      state.savedAt = d.result.body.savedAt || d.result.savedAt;
      changed = true;
    }
    const ll = loadLast();
    if (d.last && d.last.body && (!ll || (d.last.savedAt || 0) > (ll.savedAt || 0))) {
      saveLast(d.last.body);
      changed = true;
    }
    if (d.status) saveStatus(d.status);
    if (d.runner) {
      const before = localStorage.getItem("mc_runner");
      saveRunner(d.runner);
      if (before !== localStorage.getItem("mc_runner")) changed = true;
    }
    const lb = loadBilan();
    if (d.bilan && d.bilan.body && (!lb || (d.bilan.savedAt || 0) > (lb.savedAt || 0))) {
      saveBilan(d.bilan.body.result, d.bilan.body.savedAt || d.bilan.savedAt);
      changed = true;
    }
    localStorage.setItem("mc_sync", d.stravaLinked ? "ok" : "off");
    if (changed || isTabRoot(state.view)) render();
  } catch (e) {
    localStorage.setItem("mc_sync", "err");
  }
}

// Envoie objectif et préférences au serveur (pour les futures analyses automatiques)
function pushSettings() {
  if (!getAppKey()) return;
  const prefs = loadPrefs();
  fetch("/api/state", {
    method: "POST",
    headers: appHeaders(),
    body: JSON.stringify({ objective: loadObjective(), prefsPrompt: getPrefsPrompt(prefs), maxSessions: prefs.sessions }),
  }).catch(function() {});
}

// Jours écoulés depuis le dernier run
function daysSinceLastRun() {
  const acts = loadActivities();
  if (!acts) return null;
  const lastRun = acts.find(function(a) { return a.run; });
  if (!lastRun || !lastRun.iso) return null;
  const d = new Date(lastRun.iso + 'T00:00:00');
  if (isNaN(d.getTime())) return null;
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}

// Prefs helpers (séances max / semaine + jours disponibles uniquement)
function loadPrefs() {
  try { return JSON.parse(localStorage.getItem("mc_prefs") || "null") || { sessions: 4, days: [0, 2, 4, 5] }; }
  catch { return { sessions: 4, days: [0, 2, 4, 5] }; }
}
function savePrefsData(p) {
  localStorage.setItem("mc_prefs", JSON.stringify(p));
}
// Le nombre de séances est un MAXIMUM (disponibilité), jamais une cible à atteindre
function getPrefsPrompt(p) {
  const dayNames = ["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];
  const selected = [...p.days].sort((a,b)=>a-b).map(d => dayNames[d]).join(", ");
  return "\nPREFERENCES (disponibilite de Yann) : il peut courir AU MAXIMUM " + p.sessions + " fois par semaine, uniquement sur les jours disponibles : " + (selected || "non precises") + ". " + p.sessions + " est un PLAFOND de disponibilite, PAS un objectif a atteindre. Construis le meilleur programme possible dans cette limite : choisis le nombre de seances de course optimal (de 0 a " + p.sessions + ") selon la charge recente, la recuperation, le volume deja realise cette semaine, la fatigue et l'objectif. N'ajoute JAMAIS une seance uniquement pour atteindre " + p.sessions + " : proposer moins est normal si c'est plus pertinent. Les autres jours : Repos ou cross-training. Le champ week[] contient TOUJOURS exactement 7 entrees (Lun a Dim), jamais moins.";
}

// Extrait le kilometrage depuis "EF 12km"
function extractKm(session) {
  if (!session) return '';
  const m = session.match(/(\d+(?:[.,]\d+)?)\s*km/i);
  return m ? m[1] + 'km' : '';
}

// Normalise une séance course en types colorés (accents ignorés).
// Sortie longue testée en premier : "SL 18km dont allure marathon" reste une sortie longue.
function normalizeRun(s) {
  if (!s) return null;
  const sl = s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  if (/(sortie longue|long run|\bsl\b|rando course|rando-course)/.test(sl)) return { label:'Sortie longue', color:'#14121C' };
  if (/(cote|denivele|grimpe|montee)/.test(sl)) return { label:'Côtes', color:'#FF2D87' };
  if (/(fractionn|interval|vma|repet|fartlek|30\/30)/.test(sl)) return { label:'VMA', color:'#FF2D87' };
  if (/(seuil|sv2)/.test(sl)) return { label:'Seuil', color:'#9B4DFF' };
  if (/(allure marathon|allure semi|allure 10|allure spe|\bam\b|tempo|resistance|allure trail)/.test(sl)) return { label:'Allure spé', color:'#9B4DFF' };
  if (/(footing|\bef\b|endurance|recup|regen|fond|sv1|lignes droites)/.test(sl)) return { label:'EF', color:'#2E6BFF' };
  return null;
}

// Overlay helpers
function showOverlay(el) {
  const root = document.getElementById('overlay-root');
  root.innerHTML = '';

  // Changement d'écran : on replie les détails

// Auth helpers
function saveAuth(auth) { localStorage.setItem("mc_auth", JSON.stringify(auth)); state.auth = auth; }

async function getValidToken() {
  if (!state.auth) return null;
  if (Date.now() / 1000 < state.auth.expires_at - 300) return state.auth.access_token;
  const res = await fetch("/api/refresh", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ refresh_token: state.auth.refresh_token }) });
  const data = await res.json();
  if (data.access_token) { saveAuth({ ...state.auth, ...data }); return data.access_token; }
  return null;
}

function connectStrava() {
  const clientId = "259701";
  const redirect = encodeURIComponent(window.location.origin + "/api/auth");
  window.location.href = "https://www.strava.com/oauth/authorize?client_id=" + clientId + "&redirect_uri=" + redirect + "&response_type=code&scope=activity:read_all";
}

function handleOAuthParams() {
  const params = new URLSearchParams(window.location.search);
  if (params.get("access_token")) {
    saveAuth({ access_token: params.get("access_token"), refresh_token: params.get("refresh_token"), expires_at: parseInt(params.get("expires_at")), athlete_name: params.get("athlete_name") });
    if (params.get("app_key")) { localStorage.setItem("mc_app_key", params.get("app_key")); localStorage.removeItem("mc_sync"); }
    window.history.replaceState({}, "", "/");
  }
}

// API call
function analyzeWithComment(mode, extra) {
  showCommentDialog(function(comment) { analyze(mode, extra, comment); });
}

// Point d'entrée du bouton "Ma prochaine séance" (et des actions secondaires) :
// on appelle toujours l'API. Avec temperature:0 côté serveur, une situation
// identique (aucune nouvelle activité Strava) redonne le même résultat de
// façon déterministe ; une nouvelle séance loggée fait évoluer la recommandation.

async function analyze(mode, extra, comment) {
  if (!extra) extra = "";
  if (!comment) comment = "";
  setState({ loading:true, error:null, view:"loading", lastAction:{ mode:mode, extra:extra, comment:comment } });
  try {
    // Avec la clé de l'app, le serveur utilise sa propre connexion Strava :
    // l'app ne rafraîchit plus ses jetons (sinon les deux se désynchronisent).
    let token = null;
    if (!getAppKey()) {
      token = await getValidToken();
      if (!token) { setState({ loading:false, view:"login" }); return; }
    }
    const prefs = loadPrefs();
    const prefsPrompt = getPrefsPrompt(prefs);
    const res = await fetch("/api/analyze", { method:"POST", headers:appHeaders(), body:JSON.stringify({ access_token:token, mode:mode, extra:extra, prefsPrompt:prefsPrompt, maxSessions:prefs.sessions, comment:comment, objective:loadObjective() }) });
    const data = await res.json();
    if (!res.ok || !data.result) throw new Error(data.error || "Erreur serveur");

    applyAnalysisData(data);
    localStorage.removeItem('mc_pending_comment');

    if (data.result._mode === 'bilan') {
      setState({ loading:false, view:"analyses", anaTab:"bilan" });
    } else {
      setState({ loading:false, result:data.result, savedAt:data.savedAt || Date.now(), view:"result" });
    }
  } catch(e) { setState({ loading:false, error:e.message, view:"error" }); }
}

// Bouton « Analyser ma dernière séance » (même traitement que la détection automatique)
async function analyzeLastNow() {
  if (!getAppKey()) { setState({ error:"Le serveur n'est pas relié : déconnecte puis reconnecte Strava.", view:"error", lastAction:null }); return; }
  setState({ loading:true, error:null, view:"loading", lastAction:null });
  try {
    const res = await fetch("/api/last", { method:"POST", headers:appHeaders() });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Erreur serveur");
    if (data.result) applyAnalysisData(data.result);
    if (data.last) saveLast(data.last);
    if (data.result) { state.result = data.result.result; state.savedAt = data.result.savedAt; }
    if (data.last) setState({ loading:false, view:"analyses", anaTab:"last" });
    else setState({ loading:false, error:(data.error || "La dernière activité n'est pas une course : programme mis à jour, pas d'analyse détaillée."), view:"error" });
  } catch(e) { setState({ loading:false, error:e.message, view:"error" }); }
}

const css = s => Object.entries(s).map(([k,v])=>k.replace(/([A-Z])/g,'-$1').toLowerCase()+':'+v).join(';');
function h(tag, attrs) {
  const children = Array.prototype.slice.call(arguments, 2);
  const el = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(function(e) {
    const k = e[0], v = e[1];
    if (v === null || v === undefined || v === false) return;
    if (k==='style' && typeof v==='object') el.style.cssText = css(v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v);
  });
  children.flat(Infinity).forEach(function(c) {
    if (c === null || c === undefined || c === false || c === '') return;
    el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  });
  return el;
}
const has = function(v) { return v !== null && v !== undefined && String(v).trim() !== '' && String(v).trim() !== '-'; };

function fmtShortDate(iso) {

// "Du 9 au 15 nov." à partir du lundi YYYY-MM-DD
function weekRangeLabel(ws) {
  if (!ws) return '';
  const a = new Date(ws + 'T12:00:00');
  if (isNaN(a.getTime())) return '';
  const b = new Date(a); b.setDate(a.getDate() + 6);
  const m = function(d) { return d.toLocaleDateString('fr-FR', { month:'short' }); };
  return a.getMonth() === b.getMonth()
    ? 'Du ' + a.getDate() + ' au ' + b.getDate() + ' ' + m(b)
    : 'Du ' + a.getDate() + ' ' + m(a) + ' au ' + b.getDate() + ' ' + m(b);
}
// "aujourd'hui" / "demain" / "jeudi"
function dayRel(nextDay) {
  if (!nextDay) return '';
  const t = new Date().getDay();
  if (nextDay === FULL_DAYS_FR[t]) return "aujourd'hui";
  if (nextDay === FULL_DAYS_FR[(t + 1) % 7]) return 'demain';
  return String(nextDay).toLowerCase();
}

function hrLabel(v) {

// Graphe du volume de course, 12 dernières semaines (donnée brute, sans commentaire)
function volumeChart() {
  const vol = loadVolume();
  if (!vol || !vol.length) return null;
  const maxV = Math.max.apply(null, vol.map(function(v){ return v.km || 0; }).concat([1]));
  const done = vol.slice(Math.max(0, vol.length - 5), vol.length - 1);
  const avg = done.length ? Math.round(done.reduce(function(s, v){ return s + (v.km || 0); }, 0) / done.length * 10) / 10 : null;
  const lab = function(iso) { const p = (iso || '').split('-'); return p.length === 3 ? (+p[2]) + '/' + (+p[1]) : ''; };
  const bars = vol.map(function(v, i) {
    const cur = i === vol.length - 1;
    const km = v.km || 0;
    const showLab = cur || i % 3 === 0;
    return h('div', {style:{flex:'1',display:'flex',flexDirection:'column',justifyContent:'flex-end',alignItems:'center',height:'136px',minWidth:'0'}},
      cur ? h('div', {style:{fontSize:'11px',fontWeight:'700',marginBottom:'4px',whiteSpace:'nowrap'}}, fmtKm(km)) : null,
      h('div', {title: fmtKm(km) + ' km', style:{width:'100%',height:(km > 0 ? Math.max(4, Math.round(km / maxV * 100)) : 2)+'px',background: km > 0 ? (cur ? 'var(--pink)' : 'var(--violet)') : 'var(--soft)'}}),
      h('div', {class:'muted', style:{fontSize:'10px',marginTop:'6px',height:'12px',whiteSpace:'nowrap'}}, showLab ? lab(v.start) : ''));
  });
  return h('div', null,
    h('div', {class:'sec'},
      h('div', {class:'eyebrow'}, 'Volume · 12 semaines'),
      avg !== null ? h('div', {class:'muted', style:{fontSize:'12px'}}, 'moy. 4 sem. ', h('b', {style:{color:'var(--ink)'}}, fmtKm(avg) + ' km')) : null),
    h('div', {class:'card', style:{padding:'14px 14px 10px'}},
      h('div', {style:{display:'flex',gap:'5px',alignItems:'flex-end'}}, bars)));
}

// Couleur d'un bloc : échauffement bleu, retour au calme bleu, corps de séance couleur du type
function phaseColor(phase, mainColor) {
  const p = (phase || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  if (p.indexOf('chauff') >= 0 || p.indexOf('calme') >= 0) return '#2E6BFF';
  return mainColor;
}

function renderResult() {
  const d = currentResult();
  if (!d) return renderHome();
  const typeRun = normalizeRun(d.type || '') || normalizeRun(d.headline || '');
  const main = typeRun && typeRun.color !== '#14121C' ? typeRun.color : '#7B2CFF';

  const stats = [];
  if (has(d.distance)) stats.push(['Distance', d.distance]);
  if (has(d.duration)) stats.push(['Durée', d.duration]);
  if (has(d.pace)) stats.push(['Allure', d.pace]);

   ============================================================ */
function planWeekKind() {
  const ws = loadWeekStart();
  if (!ws) return null;
  const cur = getMondayStr();
  if (ws === cur) return 'current';
  return ws > cur ? 'next' : 'past';
}
function toggleWeekDetail(day) {
  setState({ weekDetail: state.weekDetail === day ? null : day });
}

function renderWeek() {
  const week = loadWeeklyPlan();
  const kind = planWeekKind();
  const ws = loadWeekStart();
  const d = currentResult();
  const logic = loadWeekLogic();
  if (!week || !week.length) {
    return h('div', {class:'screen fade'},
      h('div', {class:'h1', style:{marginBottom:'10px'}}, 'Semaine'),
      h('div', {class:'muted', style:{fontSize:'15px',lineHeight:'1.5',marginBottom:'18px'}}, 'Pas encore de programme.'),
      h('button', {class:'btn btn-primary', onclick:function(){ analyzeWithComment('session'); }}, 'Calculer mon programme'));
  }

  // Titre : partie avant " : " du fil conducteur si elle est courte
  let title = kind === 'next' ? 'Semaine prochaine' : kind === 'past' ? 'Semaine passée' : 'Cette semaine';
  let sub = logic || '';
  if (logic) {
    const i = logic.indexOf(' : ');
    if (i > 0 && i <= 26) { title = logic.slice(0, i); sub = logic.slice(i + 3); sub = sub.charAt(0).toUpperCase() + sub.slice(1); }
  }
  const runs = week.filter(function(w){ return normalizeRun(w.session); });
  const doneKm = kind === 'current' ? loadWeekDone() : null;
  const plannedKm = runs.reduce(function(s, w) {
    const km = parseFloat((extractKm(w.session) || '0').replace(',', '.'));
    return s + (isNaN(km) ? 0 : km);
  }, 0);
  const kmTxt = doneKm !== null ? fmtKm(doneKm) + ' km' : plannedKm > 0 ? fmtKm(Math.round(plannedKm)) + ' km prévus' : '';
  const nextAbbr = d && d.nextDay ? Object.keys(DAY_FULL).find(function(k){ return DAY_FULL[k] === d.nextDay; }) : null;

  const rows = week.map(function(w) {
    const run = normalizeRun(w.session);
    const open = state.weekDetail === w.day;
    const isNext = !w.done && nextAbbr === w.day;
    if (!run) {
      return h('div', {style:{display:'flex',alignItems:'center',gap:'14px',padding:'10px 14px'}},
        h('div', {style:{width:'34px',fontSize:'13px',fontWeight:'700',color:'var(--muted)'}}, w.day),
        h('div', {style:{width:'6px',height:'6px',background:'#D9D3E4'}}),
        h('div', {class:'muted', style:{flex:'1',fontSize:'14px'}}, w.session || 'Repos'));
    }
    const detail = has(w.detail) ? w.detail : 'Détail indisponible : recalcule la séance pour l\'obtenir.';
    return h('div', {style:{background:'var(--card)',border: isNext ? '2px solid var(--blue)' : '2px solid transparent'}},
      h('button', {onclick:function(){ toggleWeekDetail(w.day); }, 'aria-expanded': open ? 'true' : 'false', style:{display:'flex',alignItems:'center',gap:'14px',width:'100%',padding:'12px',textAlign:'left',minHeight:'54px'}},
        h('div', {style:{width:'34px',fontSize:'13px',fontWeight:'700',color: isNext ? 'var(--ink)' : 'var(--muted)'}}, w.day),
        h('div', {style:{width:'6px',height:'30px',background:run.color,flexShrink:'0'}}),
        h('div', {style:{flex:'1',fontSize:'15px',fontWeight: isNext ? '700' : '600',minWidth:'0'}}, w.session),
        w.done ? h('span', {role:'img','aria-label':'Faite',style:{display:'inline-flex'}}, icon('check', 20, '#5E586F', 2.5))
          : isNext ? h('span', {style:{fontSize:'12px',fontWeight:'700',color:'var(--blue)'}}, 'À venir') : null),
      open ? h('div', {style:{padding:'0 14px 14px 68px',fontSize:'14px',lineHeight:'1.5',color:'var(--ink)'}}, detail) : null);
  });

  return h('div', {class:'screen fade'},
    h('div', {class:'eyebrow'}, weekRangeLabel(ws)),
    h('div', {style:{display:'flex',justifyContent:'space-between',alignItems:'baseline',gap:'12px',margin:'8px 0 6px'}},
      h('div', {class:'h1'}, title),
      kmTxt ? h('div', {class:'d', style:{fontSize:'17px',fontWeight:'700',color:'var(--pink-text)',whiteSpace:'nowrap'}}, kmTxt) : null),
    sub ? h('div', {class:'muted', style:{fontSize:'14px',lineHeight:'1.45'}}, sub) : null,
    kind === 'past' ? h('div', {class:'card', style:{marginTop:'12px',fontSize:'14px'}}, 'Programme périmé : recalcule ta séance pour le mettre à jour.') : null,
    h('div', {style:{display:'flex',flexDirection:'column',gap:'6px',marginTop:'20px'}}, rows),
    h('div', {class:'muted', style:{fontSize:'12px',marginTop:'12px'}}, 'Touche une séance pour voir son contenu.'));
}

  const nameIn = h('input', {class:'obj-input', type:'text', placeholder:'Ex : Marathon de Rome'});
  nameIn.value = draft.name; nameIn.oninput = function(){ draft.name = nameIn.value; };
  const dateIn = h('input', {class:'obj-input', type:'date'});

  const distIn = h('input', {class:'obj-input', type:'number', inputmode:'decimal', min:'0', step:'0.1', placeholder:'42,2'});
  distIn.value = draft.distanceKm != null ? draft.distanceKm : ''; distIn.oninput = function(){ const v = parseFloat(distIn.value); draft.distanceKm = v > 0 ? v : null; };
  const dplusIn = h('input', {class:'obj-input', type:'number', inputmode:'numeric', min:'0', step:'50', placeholder:'0'});
  dplusIn.value = draft.dplus != null ? draft.dplus : ''; dplusIn.oninput = function(){ const v = parseInt(dplusIn.value, 10); draft.dplus = v > 0 ? v : null; };
  const cur = draft.targetTime || 0;
  const hIn = h('input', {class:'obj-input', type:'number', inputmode:'numeric', min:'0', max:'23', placeholder:'h', 'aria-label':'Heures', style:{textAlign:'center'}});
  const mIn = h('input', {class:'obj-input', type:'number', inputmode:'numeric', min:'0', max:'59', placeholder:'min', 'aria-label':'Minutes', style:{textAlign:'center'}});
  hIn.value = cur ? String(Math.floor(cur / 60)) : ''; mIn.value = cur ? String(cur % 60) : '';
  const syncTime = function() { const t = (parseInt(hIn.value, 10) || 0) * 60 + (parseInt(mIn.value, 10) || 0); draft.targetTime = t > 0 ? t : null; };
  hIn.oninput = syncTime; mIn.oninput = syncTime;
  const err = h('div', {style:{fontSize:'13px',color:'var(--pink-text)',textAlign:'center',minHeight:'18px',margin:'12px 0 6px'}});

  return h('div', {class:'screen fade'},
    backBar('Profil', 'profil'),
    h('div', {class:'h1', style:{marginBottom:'6px'}}, existing ? 'Mon objectif' : 'Nouvel objectif'),
    h('div', {class:'muted', style:{fontSize:'14px',lineHeight:'1.5'}}, 'Compte à rebours, phases et indice de confiance en dépendent.'),
    h('div', {class:'card', style:{marginTop:'16px',paddingTop:'4px'}},
      field('Nom de la course', nameIn, 'o-name'),
      field('Date', dateIn, 'o-date'),
      h('div', {class:'grid2'}, field('Distance (km)', distIn, 'o-dist'), field('D+ (m)', dplusIn, 'o-dplus')),
      h('div', {style:{marginTop:'14px'}},
        h('div', {class:'obj-label'}, 'Temps visé (indicatif)'),
        h('div', {style:{display:'flex',gap:'8px',alignItems:'center'}}, hIn, h('span', {class:'muted'}, 'h'), mIn, h('span', {class:'muted'}, 'min')))),
    err,
    h('button', {class:'btn btn-primary', onclick:function() {
      if (!draft.name.trim() && !draft.date && !draft.distanceKm && !draft.dplus && !draft.targetTime) { err.textContent = 'Renseigne au moins un nom ou une date.'; return; }
      saveObjective({ name: draft.name.trim(), date: draft.date || null, distanceKm: draft.distanceKm, dplus: draft.dplus, targetTime: draft.targetTime });
      pushSettings();
      invalidateObjectiveCaches();
      setState({ view:'home' });
    }}, existing ? 'Enregistrer' : 'Créer l\'objectif'),
    existing ? h('button', {class:'btn btn-danger', style:{marginTop:'8px'}, onclick:function() {
      showConfirm({ title:'Supprimer l\'objectif ?', sub:'Retour en entraînement libre : plus de compte à rebours ni d\'indice de confiance.', okLabel:'Supprimer', onConfirm:function() {
        clearObjective(); pushSettings(); invalidateObjectiveCaches(); setState({ view:'home' });
      }});
    }}, 'Supprimer l\'objectif') : null,
    h('div', {class:'muted', style:{fontSize:'12px',textAlign:'center',lineHeight:'1.5',marginTop:'14px'}}, 'Modifier l\'objectif efface la séance et le bilan en cache.'));
}

/* ---------------- Notifications push ---------------- */
function pushSupported() {
  return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
}
function isStandalone() {
  return !!(window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches));
}
function swReady(timeoutMs) {
  return Promise.race([
    navigator.serviceWorker.ready,
    new Promise(function(_, rej) { setTimeout(function() { rej(new Error('Service worker indisponible')); }, timeoutMs || 6000); }),
  ]);
}
function b64ToU8(b64) {
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}
async function loadPushInfo() {
  if (!pushSupported()) return { supported:false };
  const info = { supported:true, permission: Notification.permission, subscribed:false, devices:0 };
  try {
    const reg = await swReady();
    const sub = await reg.pushManager.getSubscription();
    const r = await fetch('/api/push', { headers: appHeaders() });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Erreur');
    info.devices = d.devices || 0;
    info.subscribed = !!(sub && (d.endpoints || []).indexOf(sub.endpoint) >= 0);
  } catch(e) { info.error = e.message; }
  return info;
}
async function enablePush() {
  try {
    // La demande d'autorisation doit partir directement du toucher (exigence iOS)
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') throw new Error('Autorisation refusée. Réactive-la dans Réglages > Notifications > Coach.');
    const reg = await swReady();
    const r = await fetch('/api/push', { headers: appHeaders() });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Erreur');
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: b64ToU8(d.publicKey) });
    const r2 = await fetch('/api/push', { method:'POST', headers: appHeaders(), body: JSON.stringify({ subscription: sub.toJSON() }) });
    if (!r2.ok) throw new Error('Enregistrement refusé par le serveur');
    setState({ pushInfo: await loadPushInfo(), pushMsg: 'Notifications activées.' });
  } catch(e) { setState({ pushInfo: await loadPushInfo(), pushMsg: e.message }); }
}
async function testPush() {
  try {
    const r = await fetch('/api/push', { method:'POST', headers: appHeaders(), body: JSON.stringify({ action:'test' }) });
    const d = await r.json();
    setState({ pushMsg: r.ok ? (d.sent ? 'Notification de test envoyée.' : 'Aucun appareil abonné.') : (d.error || 'Erreur') });
  } catch(e) { setState({ pushMsg: e.message }); }
}
async function disablePush() {
  try {
    const reg = await swReady();
    const sub = await reg.pushManager.getSubscription();
    if (sub) {
      await fetch('/api/push', { method:'DELETE', headers: appHeaders(), body: JSON.stringify({ endpoint: sub.endpoint }) });
      await sub.unsubscribe();
    }
    setState({ pushInfo: await loadPushInfo(), pushMsg: 'Notifications désactivées sur cet appareil.' });
  } catch(e) { setState({ pushMsg: e.message }); }
}

/* ---------------- État du coach automatique ---------------- */
async function openStatus() {
  setState({ view:'status', hook:null, hookError:null, pushInfo:null, pushMsg:null });
  if (!getAppKey()) return;
  await syncFromServer();
  loadPushInfo().then(function(pi) { if (state.view === 'status') setState({ pushInfo: pi }); });
  try {
    const r = await fetch('/api/hook', { headers: appHeaders() });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Erreur');
    if (state.view === 'status') setState({ hook:d });
  } catch(e) { if (state.view === 'status') setState({ hookError:e.message }); }
}
async function setHook(method) {
  setState({ hook:null, hookError:null });
  try {
    const r = await fetch('/api/hook', { method: method, headers: appHeaders() });
    const d = await r.json();
    if (!r.ok) throw new Error((d.error || 'Erreur') + (d.detail ? ' : ' + JSON.stringify(d.detail).slice(0, 200) : ''));
    setState({ hook:d });
  } catch(e) { setState({ hookError:e.message }); }
}

function renderStatus() {
  const st = loadStatus() || {};
  const key = !!getAppKey();
  const sync = syncStatus();
  const GOOD = 'var(--blue)', BAD = 'var(--pink-text)', WAIT = 'var(--violet-dark)';
  const line = function(label, value, color) {
    return h('div', {class:'row'}, h('span', {class:'k'}, label), h('span', {class:'v', style:{color: color || 'var(--ink)'}}, value));
  };
  const hook = state.hook;
  const hookTxt = !key ? 'serveur non relié' : state.hookError ? 'erreur' : hook == null ? 'vérification…' : hook.active ? 'active' : 'inactive';
  const hookColor = hook && hook.active ? GOOD : state.hookError ? BAD : WAIT;
  const lp = st.lastPipeline;
  const pi = state.pushInfo;
  const pushTxt = !key ? 'serveur non relié'
    : !pushSupported() ? (isStandalone() ? 'non prises en charge' : 'ouvre l\'app depuis l\'écran d\'accueil')
    : pi == null ? 'vérification…'
    : pi.permission === 'denied' ? 'bloquées (Réglages iOS)'
    : pi.subscribed ? 'actives' : 'inactives';
  const pushColor = pi && pi.subscribed ? GOOD : (pi && pi.permission === 'denied') ? BAD : WAIT;
  const msg = function(t, color) { return h('div', {class:'card', style:{marginTop:'8px',fontSize:'14px',lineHeight:'1.5',wordBreak:'break-word',color: color || 'var(--ink)'}}, t); };

  return h('div', {class:'screen fade'},
    backBar('Profil', 'profil'),
    h('div', {class:'h1', style:{marginBottom:'16px'}}, 'État du coach'),
    h('div', {class:'card', style:{padding:'4px 18px'}},
      line('Version de l\'app', 'v' + APP_VERSION),
      line('Serveur', sync === 'ok' ? 'relié' : sync === null ? 'non relié' : sync === 'err' ? 'injoignable' : 'indisponible', sync === 'ok' ? GOOD : BAD),
      line('Détection auto', hookTxt, hookColor),
      line('Dernière activité reçue', st.lastEvent ? fmtDateTime(st.lastEvent.at) : 'aucune'),
      line('Dernière analyse', lp ? fmtDateTime(lp.at) + (lp.source === 'webhook' ? ' (auto)' : ' (manuelle)') : 'aucune'),
      line('Résultat', lp ? (lp.ok ? 'OK' + (lp.durationS ? ' · ' + lp.durationS + ' s' : '') : 'échec') : '-', lp ? (lp.ok ? GOOD : BAD) : null),
      line('Notifications', pushTxt, pushColor)),
    (lp && !lp.ok && lp.error) ? msg('Dernière erreur : ' + lp.error, BAD) : null,
    state.hookError ? msg(state.hookError, BAD) : null,
    state.pushMsg ? msg(state.pushMsg) : null,
    (key && pi && pi.supported && !pi.subscribed && pi.permission !== 'denied') ? h('button', {class:'btn btn-primary', style:{marginTop:'12px'}, onclick:function(){ enablePush(); }}, 'Activer les notifications') : null,
    (key && pi && pi.subscribed) ? h('div', {class:'grid2', style:{marginTop:'12px'}},
      h('button', {class:'btn', onclick:function(){ testPush(); }}, 'Tester'),
      h('button', {class:'btn btn-danger', onclick:function(){ disablePush(); }}, 'Désactiver')) : null,
    (key && hook && !hook.active) ? h('button', {class:'btn btn-primary', style:{marginTop:'8px'}, onclick:function(){ setHook('POST'); }}, 'Activer la détection automatique') : null,
    (key && hook && hook.active) ? h('div', {class:'muted', style:{fontSize:'12px',lineHeight:'1.5',marginTop:'12px',wordBreak:'break-all'}}, 'Strava prévient : ' + (hook.callbackUrl || '')) : null,
    (key && hook && hook.active) ? h('button', {class:'btn btn-danger', style:{marginTop:'8px'}, onclick:function(){ showConfirm({ title:'Désactiver la détection ?', sub:'Strava ne préviendra plus l\'app. Tu pourras la réactiver ici.', okLabel:'Désactiver', onConfirm:function(){ setHook('DELETE'); } }); }}, 'Désactiver la détection automatique') : null,
    h('button', {class:'btn', style:{marginTop:'8px'}, onclick:function(){ openStatus(); }}, 'Rafraîchir'));
}

/* ============================================================
   Rendu
   ============================================================ */
let lastRenderedView = null;
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const noTabs = state.view === 'login' || state.view === 'loading';
  document.body.classList.toggle('no-tabs', noTabs);
  const views = { home:renderHome, week:renderWeek, analyses:renderAnalyses, profil:renderProfil, login:renderLogin, loading:renderLoading, error:renderError, cross:renderCross, result:renderResult, prefs:renderPrefs, objective:renderObjective, status:renderStatus };
  app.appendChild((views[state.view] || renderHome)());
  if (!noTabs) app.appendChild(renderTabBar());
  if (lastRenderedView !== state.view) { window.scrollTo(0, 0); lastRenderedView = state.view; }
}

// Anciens liens (notifications) : last, bilan, runner → nouveaux onglets
function routeFromParam(v) {
  if (v === 'last') return { view:'analyses', anaTab:'last' };
  if (v === 'bilan') return { view:'analyses', anaTab:'bilan' };
  if (v === 'runner') return { view:'profil' };
  if (v === 'result' || v === 'week' || v === 'profil' || v === 'analyses') return { view:v };
  if (v === 'status') return { view:'status' };
  return null;
}

// Init
handleOAuthParams();
(function deepLink() {
  const r = routeFromParam(new URLSearchParams(window.location.search).get('view'));
  if (r) { Object.assign(state, r); window.history.replaceState({}, '', '/'); }
})();
if (!state.auth) state.view = 'login';
render();
if (state.auth) syncFromServer();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(function() {});
  // Notification touchée alors que l'app était déjà ouverte
  navigator.serviceWorker.addEventListener('message', function(ev) {
    if (!ev.data || ev.data.type !== 'open') return;
    const v = new URLSearchParams((ev.data.url || '').split('?')[1] || '').get('view');
    syncFromServer().then(function() {
      if (v === 'status') { openStatus(); return; }
      setState(routeFromParam(v) || { view:'home' });
    });
  });
}
